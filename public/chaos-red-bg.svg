<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chaos red background</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070104">
        <animate attributeName="stop-color" values="#070104;#16020a;#0a0003;#1c0309;#070104" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#020001">
        <animate attributeName="stop-color" values="#020001;#0d0105;#1a0208;#050002;#020001" dur="13s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="gRed">
      <stop offset="0" stop-color="#ff1f35" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#d1001f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d1001f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBlood">
      <stop offset="0" stop-color="#8f0014" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#5a000d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5a000d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gEmber">
      <stop offset="0" stop-color="#ff4a1c" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#e0141f" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e0141f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gHot">
      <stop offset="0" stop-color="#ff7a85" stop-opacity=".8"/>
      <stop offset=".35" stop-color="#ff1f35" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff1f35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".92"/>
    </radialGradient>

    <!-- wobbling distortion for veins + rings (remove filter="url(#warp)" below if you need more speed) -->
    <filter id="warp" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="2" seed="4" result="n">
        <animate attributeName="baseFrequency" dur="23s" values="0.004 0.009;0.010 0.004;0.006 0.013;0.003 0.008;0.004 0.009" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="110" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- 1. base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 2. lurching red blobs: prime-ish durations so the loop never visibly repeats -->
  <g style="mix-blend-mode:screen">
    <circle r="480" fill="url(#gRed)">
      <animateMotion dur="11s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;.15;.2;.62;.68;1" keyTimes="0;.12;.3;.5;.72;1"
        path="M300,250 C900,-150 1700,200 1650,800 S500,1250 300,250 Z"/>
      <animate attributeName="r" values="480;320;560;380;480" dur="5.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="420" fill="url(#gBlood)">
      <animateMotion dur="17s" repeatCount="indefinite"
        keyPoints="0;.3;.34;.8;.85;1" keyTimes="0;.2;.35;.6;.8;1"
        path="M1600,900 C1000,1300 200,900 350,400 S1500,-100 1600,900 Z"/>
      <animate attributeName="r" values="420;560;300;500;420" dur="7.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="340" fill="url(#gEmber)">
      <animateMotion dur="7s" repeatCount="indefinite"
        keyPoints="0;.4;.45;.9;1" keyTimes="0;.25;.4;.8;1"
        path="M960,100 C1800,300 1700,1000 900,950 S100,500 960,100 Z"/>
      <animate attributeName="r" values="340;200;400;260;340" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="300" fill="url(#gHot)">
      <animateMotion dur="13s" repeatCount="indefinite"
        keyPoints="0;.1;.5;.55;1" keyTimes="0;.15;.45;.6;1"
        path="M200,900 C600,300 1300,1100 1750,250 S400,-50 200,900 Z"/>
      <animate attributeName="r" values="300;180;360;220;300" dur="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.3;1;.5;.9" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="520" fill="url(#gBlood)">
      <animateMotion dur="23s" repeatCount="indefinite"
        path="M1000,500 C1500,100 1900,600 1300,1000 S300,900 700,300 S1000,500 1000,500 Z"/>
      <animate attributeName="r" values="520;380;620;420;520" dur="9.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#gRed)">
      <animateMotion dur="5s" repeatCount="indefinite"
        keyPoints="0;.25;.3;.75;.8;1" keyTimes="0;.1;.25;.5;.7;1"
        path="M1500,200 C1100,500 1300,900 600,800 S300,200 1500,200 Z"/>
    </circle>
  </g>

  <!-- 3. veins, cracks and rotating rings, warped -->
  <g filter="url(#warp)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ff2a3d" stroke-width="2">
      <path pathLength="1000" stroke-dasharray="260 740" d="M-40,180 L180,260 L250,200 L430,340 L390,420 L640,480 L720,400 L930,560 L1010,500 L1250,640 L1180,730 L1460,800 L1550,720 L1960,900">
        <animate attributeName="stroke-dashoffset" values="1000;-1000" dur="2.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.2;1;.6;0;1" dur="1.3s" repeatCount="indefinite"/>
      </path>
      <path pathLength="1000" stroke-dasharray="180 820" d="M1960,120 L1700,220 L1640,160 L1420,300 L1470,380 L1180,420 L1100,340 L860,470 L920,560 L640,640 L700,720 L380,820 L440,920 L-40,1000">
        <animate attributeName="stroke-dashoffset" values="1000;-1000" dur="3.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".3;1;.1;1;.5" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <path pathLength="1000" stroke-dasharray="320 680" d="M500,-40 L540,160 L460,260 L600,400 L540,520 L700,640 L650,780 L820,900 L780,1120">
        <animate attributeName="stroke-dashoffset" values="0;-1000" dur="5.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1;.4;1;0;0;1" dur="2.3s" repeatCount="indefinite"/>
      </path>
      <path pathLength="1000" stroke-dasharray="140 860" stroke-width="1.5" d="M1300,-40 L1260,140 L1380,230 L1330,380 L1480,470 L1420,620 L1590,720 L1540,880 L1700,1120">
        <animate attributeName="stroke-dashoffset" values="1000;0" dur="4.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;1;.7;0;1" dur="1.7s" repeatCount="indefinite"/>
      </path>
      <path pathLength="1000" stroke-dasharray="90 910" stroke-width="1" d="M-40,620 L140,560 L220,640 L400,580 L470,700 L700,640 L780,760 L1020,700 L1100,820 L1380,760 L1960,980">
        <animate attributeName="stroke-dashoffset" values="0;-1000" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.1;.8;0;1" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <circle cx="960" cy="540" r="300" stroke="#ff2a3d" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 18">
      <animateTransform attributeName="transform" type="rotate" from="0 960 540" to="360 960 540" dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="540" r="480" stroke="#c1001f" stroke-opacity=".6" stroke-width="2" stroke-dasharray="60 40 6 40">
      <animateTransform attributeName="transform" type="rotate" from="360 960 540" to="0 960 540" dur="31s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="540" r="700" stroke="#ff4a1c" stroke-opacity=".4" stroke-width="1" stroke-dasharray="1 30">
      <animateTransform attributeName="transform" type="rotate" from="0 960 540" to="360 960 540" dur="47s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="540" r="880" stroke="#8f0014" stroke-opacity=".7" stroke-width="3" stroke-dasharray="200 400 20 400">
      <animateTransform attributeName="transform" type="rotate" from="360 960 540" to="0 960 540" dur="19s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 4. glitch bars: discrete jumps, no easing -->
  <g fill="#ff2a3d">
    <rect x="0" y="120" width="1920" height="3" opacity="0">
      <animate attributeName="y" values="120;640;310;880;50;520;990" dur="1.7s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0;0;.5;0;.8" dur="1.7s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="400" width="900" height="8" opacity="0">
      <animate attributeName="y" values="400;90;760;230;940;560" dur="2.3s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="x" values="200;900;0;1100;500;1400" dur="2.3s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.35;0;.5;0;.25" dur="2.3s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="700" width="1400" height="2" opacity="0">
      <animate attributeName="y" values="700;180;980;420;60;820;300;610" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0;.6;0;0;.8;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="300" width="700" height="14" opacity="0">
      <animate attributeName="y" values="300;880;120;640;20;770" dur="3.1s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.2;0;0;.3;0" dur="3.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 5. lightning flash, irregular heartbeat -->
  <rect width="1920" height="1080" fill="#ff1f35" opacity="0">
    <animate attributeName="opacity" values="0;0;.14;0;.06;0;0;.1;0;0;0" dur="6.1s" repeatCount="indefinite"/>
  </rect>

  <!-- 6. vignette + grain keep the glass panels readable -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".09" style="mix-blend-mode:overlay"/>
</svg>
